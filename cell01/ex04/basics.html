<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        h1 {
            font-size: 50px;
            text-align: center;
            color: white;
        }
        img {
            max-width: 250px;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 100px;
        }
        .card {
            font-size: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        hr {
            margin-top: 30px;
        }
        p {
            font-family: monospace;
            font-style: italic;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Hello%&@</h1>
    <div class="container">
        <div class="card">
            <img src="https://freelogopng.com/images/all_img/1656180674shopee-logo-transparent.png">
            <a href="https://shopee.co.th/" target="_blank">https://shopee.co.th/</a>
        </div>
        <div class="card">
            <img src="https://freepnglogo.com/images/all_img/1701498708lazada-png-logo.png">
            <a href="https://www.lazada.co.th/" target="_blank">https://www.lazada.co.th/</a>
        </div>
    </div>
    <hr>
    <p>
        © wil 2026
    </p>

</html>
