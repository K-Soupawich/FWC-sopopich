<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            margin: 0 auto;
            width: 70%;
            height: 400px;
            border-collapse: collapse;
        }
        td {
            font-size: 20px;
            width: 50%;
            height: auto;
            border: 2px solid black;
        }
        #box1 {
            background-color: rgb(145, 248, 248);
        }
        #box2 {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td id="box1">
                Left Cell
            </td>
            <td id="box2">
                Right Cell
            </td>
        </tr>
    </table>
</body>
</html>
